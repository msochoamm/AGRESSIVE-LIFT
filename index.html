<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AGRESSIVE LIFT">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<link rel="modulepreload" href="app.js"><link rel="modulepreload" href="store.js"><link rel="modulepreload" href="engine.js"><link rel="modulepreload" href="nutrition.js">
<title>AGRESSIVE LIFT</title>
</head>
<body>
<div id="app"><div style="padding:30vh 16px 0;text-align:center;color:#ff2b57;font-size:22px">Cargando…</div></div>
<script>
/* Si la app no arranca, muestra el motivo en pantalla en vez de dejarla en negro. */
function repair(){var p=[];try{p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}))}catch(e){}try{p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}))}catch(e){}Promise.all(p).catch(function(){}).then(function(){location.reload()})}
function fail(m){if(window.__ok)return;document.getElementById('app').innerHTML='<div style="padding:25vh 16px 0;text-align:center;color:#ff2b57;font-size:22px">No se pudo iniciar<br><small style="color:#a1a1aa;font-size:14px">'+String(m).replace(/</g,'&lt;')+'</small><br><button id="fix" style="margin-top:22px;padding:14px 22px;border-radius:14px;border:2px solid #ff2b57;background:#000;color:#fff;font-size:16px;font-weight:900">Reparar y reintentar</button><br><small style="color:#71717a;font-size:12px">Limpia la caché de la app. No borra tus datos.</small></div>';var b=document.getElementById('fix');if(b)b.onclick=repair}
addEventListener('error',e=>fail(e.message));addEventListener('unhandledrejection',e=>fail(e.reason));
setTimeout(()=>fail('Tiempo agotado. Revisa que todos los archivos estén en la misma carpeta (app.js, store.js, engine.js, nutrition.js, supabase.js, pdf.js).'),7000);
</script>
<script>
/* ¿Quién entrena? Se pregunta antes de abrir la app; "Cambiar usuario" vuelve aquí. */
(function(){
  var P=sessionStorage.getItem('al:profile');
  function start(){import('./app.js').catch(function(e){fail(e.message||e)})}
  if(P==='juani'||P==='sebastian')return start();
  window.__ok=1;
  var h='<div style="padding:14vh 16px 0;text-align:center"><img src="logo.png" width="180" height="180" alt="" style="margin:0 auto"><p style="color:#a1a1aa;margin:12px 0 24px">¿Quién va a entrenar?</p>';
  [['juani','JUANI'],['sebastian','SEBASTIAN']].forEach(function(u){h+='<button data-u="'+u[0]+'" style="display:block;width:100%;max-width:320px;margin:0 auto 12px;padding:16px;border-radius:14px;border:2px solid #ff2b57;background:#000;color:#fff;font-size:20px;font-weight:900;letter-spacing:2px">'+u[1]+'</button>'});
  document.getElementById('app').innerHTML=h+'</div>';
  document.getElementById('app').onclick=function(e){var b=e.target.closest('button[data-u]');if(!b)return;sessionStorage.setItem('al:profile',b.dataset.u);window.__ok=0;document.getElementById('app').innerHTML='<div style="padding:30vh 16px 0;text-align:center;color:#ff2b57;font-size:22px">Cargando…</div>';start();};
})();
</script>
</body>
</html>
